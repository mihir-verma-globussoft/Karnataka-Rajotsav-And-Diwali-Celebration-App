name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Exact version: the action cannot resolve the range in pubspec.yaml.
          # Keep in sync with the Flutter version developers use locally.
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: ./scripts/check.sh
      - run: flutter build apk --debug
